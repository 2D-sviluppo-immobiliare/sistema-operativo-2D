<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#0a1a2a"/>
      <stop offset="45%"  stop-color="#081320"/>
      <stop offset="100%" stop-color="#03070c"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#e6c478" stop-opacity="0.16"/>
      <stop offset="42%"  stop-color="#3d5f80" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 H 0 V 80" fill="none" stroke="#8fb0cc" stroke-width="0.6" stroke-opacity="0.055"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.10"/>
    </pattern>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e6c478" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e6c478" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e6c478" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e6c478" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e6c478" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#scan)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- cornice e angoli -->
  <rect x="36" y="36" width="1848" height="1008" fill="none"
        stroke="#e6c478" stroke-opacity="0.12" stroke-width="1"/>
  <g stroke="#e6c478" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M36 118 V36 H118"/>
    <path d="M1802 36 H1884 V118"/>
    <path d="M1884 962 V1044 H1802"/>
    <path d="M118 1044 H36 V962"/>
  </g>

  <!-- emblema -->
  <g transform="translate(960 430)">
    <rect x="-152" y="-152" width="304" height="304" fill="none"
          stroke="#e6c478" stroke-opacity="0.14" stroke-width="1"
          transform="rotate(45)"/>
    <rect x="-132" y="-132" width="264" height="264" fill="none"
          stroke="#e6c478" stroke-opacity="0.07" stroke-width="1"
          transform="rotate(45)"/>

    <!-- tacche -->
    <g stroke="#e6c478" stroke-opacity="0.42" stroke-width="2">
      <path d="M0 -196 V-176"/>
      <path d="M0 196 V176"/>
      <path d="M-196 0 H-176"/>
      <path d="M196 0 H176"/>
    </g>

    <text x="0" y="54" text-anchor="middle"
          font-family="DejaVu Sans, Liberation Sans, sans-serif"
          font-size="164" font-weight="700" letter-spacing="18"
          fill="#e6c478">2D</text>
  </g>

  <!-- testo centrale -->
  <g text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif">
    <line x1="660" y1="672" x2="1260" y2="672" stroke="url(#hairline)" stroke-width="1"/>
    <text x="960" y="722" font-size="30" letter-spacing="16"
          fill="#cfdae4" fill-opacity="0.92">SVILUPPO IMMOBILIARE</text>
    <text x="960" y="768" font-size="17" letter-spacing="9"
          fill="#8aa4bb" fill-opacity="0.85">PORTABLE INTELLIGENCE OPERATING SYSTEM</text>
  </g>

  <!-- barra inferiore -->
  <line x1="36" y1="982" x2="1884" y2="982" stroke="#e6c478" stroke-opacity="0.14" stroke-width="1"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="15" letter-spacing="5">
    <text x="70" y="1016" fill="#8aa4bb" fill-opacity="0.75">2D OS</text>
    <text x="1850" y="1016" text-anchor="end" fill="#8aa4bb" fill-opacity="0.5">INTELLIGENCE · REAL ESTATE · CONSTRUCTION</text>
  </g>
</svg>
