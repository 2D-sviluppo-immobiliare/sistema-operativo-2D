# 2D OS - profilo del compositore (profilo "immersive")
# Usato solo quando 2d-mode rileva una GPU con accelerazione reale.

backend = "glx";
vsync = true;

# Ombre e angoli: l'identita' visiva 2D resta sobria, niente effetti pesanti
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.55;
shadow-offset-x = -8;
shadow-offset-y = -8;
corner-radius = 8;

# Dissolvenze brevi: 0.06 per passo, ~300 ms totali
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 16;

# Le finestre dell'HUD e della dock non devono avere ombre
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g = 'Plank'",
  "class_g = 'Xfce4-notifyd'",
  "name = '2D HUD'",
  "override_redirect = true"
];

# Animazioni di apertura/chiusura (picom >= 10).
# Se la versione installata non le supporta, 2d-mode riparte con una
# configurazione ridotta: il sistema resta comunque utilizzabile.
animations = true;
animation-stiffness-in-tag = 180;
animation-window-mass = 0.6;
animation-for-open-window = "zoom";
animation-for-close-window = "zoom";

# Sfocatura disattivata: costosa e poco utile su schermi piccoli
blur-background = false;
