-- 2D OS - pannello HUD
-- Sovrapposizione discreta in alto a destra, con i dati che contano.
-- Viene avviata solo dal profilo "immersive" di 2d-mode.

conky.config = {
    update_interval = 2,
    total_run_times = 0,

    alignment = 'top_right',
    gap_x = 28,
    gap_y = 44,
    minimum_width = 250,
    maximum_width = 250,

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 165,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_shades = false,
    draw_outline = false,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    xftalpha = 0.9,
    uppercase = false,

    default_color = '#c8d6e2',
    color1 = '#e6c478',
    color2 = '#8aa4bb',
    color3 = '#5f7d97',

    border_inner_margin = 12,
    border_outer_margin = 8,
}

conky.text = [[
${color1}2D OS${color}  ${color3}|${color}  ${color2}${nodename}${color}
${color3}─────────────────────────${color}
${color2}ORE${color}   ${time %H:%M}  ${color3}·${color} ${time %a %d %b}
${color3}─────────────────────────${color}
${color2}CPU${color}   ${cpu cpu0}%  ${cpubar cpu0 4,110}
${color2}RAM${color}   ${memperc}%  ${membar 4,110}
${color2}SWAP${color}  ${swapperc}%  ${swapbar 4,110}
${color2}DISCO${color} ${fs_used_perc /}%  ${fs_bar 4,110}
${color3}─────────────────────────${color}
${color2}GPU${color}   ${execi 5 2d-gpu}
${color2}NET${color}   ${downspeedf enp0s3}↓ ${upspeedf enp0s3}↑  ${color3}kB/s${color}
${color3}─────────────────────────${color}
${color2}BAT${color}   ${if_existing /sys/class/power_supply/BAT0}${battery_percent BAT0}%${else}rete fissa${endif}
${color3}press ${color2}HUD${color3} per chiudere${color}
]]
