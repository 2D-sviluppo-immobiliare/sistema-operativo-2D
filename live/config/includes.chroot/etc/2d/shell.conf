# 2D Shell - configurazione del desktop proprietario
#
# Questo file viene letto da /usr/lib/2d-os/shell/2d-shell.
# Una copia in ~/.config/2d/shell.conf ha la precedenza.

[shell]
# Dimensione icona in pixel
icon_size = 64

# Dimensioni della cella (icona + etichetta)
cell_width = 116
cell_height = 124

# Margine dal bordo dello schermo
margin = 40

# Animazione di ingresso delle icone
animation_ms = 700
stagger_ms = 55
# Quanti pixel arrivano da fuori schermo
slide_px = 150

# Mostrare anche i file .desktop presenti sul Desktop dell'utente
show_desktop_files = 1

# HUD integrato nella shell (ora, CPU, RAM). 0 = usa conky o nulla.
hud = 1

# Applicazioni mostrate, in ordine
apps = 2d-hwreport.desktop, chromium.desktop, thunar.desktop, xfce4-terminal.desktop, mousepad.desktop, ristretto.desktop, xfce4-settings-manager.desktop
