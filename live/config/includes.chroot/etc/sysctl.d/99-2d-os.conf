# 2D OS - parametri kernel per Live USB
# swappiness alto: con zram conviene spostare pagine in memoria compressa
# piuttosto che leggere/scrivere sul supporto USB.
vm.swappiness = 100
vm.vfs_cache_pressure = 50

# Strumenti di sviluppo (watcher dei file)
fs.inotify.max_user_watches = 524288

# Meno scritture superflue sul supporto USB
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs = 30000
